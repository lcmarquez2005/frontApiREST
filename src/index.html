<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>API REST Console</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <style>
    html, body {
      margin: 0; padding: 0;
      background: #050a12;
      overflow-x: hidden;
      min-height: 100vh;
    }
    #bg-canvas {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      display: block;
    }
    app-root {
      position: relative;
      z-index: 1;
      display: block;
    }
  </style>
</head>
<body>
  <!-- Canvas FUERA de Angular — nunca lo toca el hydration -->
  <canvas id="bg-canvas"></canvas>
  <app-root></app-root>

  <script>
    (function () {
      var s = document.createElement('script');
      s.src = 'https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js';
      s.onload = function () { initThree(); };
      document.head.appendChild(s);

      function initThree() {
        var THREE = window.THREE;
        var canvas = document.getElementById('bg-canvas');
        if (!canvas) return;

        var renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, alpha: false });
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setClearColor(0x050a12, 1);

        var scene = new THREE.Scene();
        var camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 0, 30);

        var nodeCount = 120;
        var positions = new Float32Array(nodeCount * 3);
        var velocities = [];
        for (var i = 0; i < nodeCount; i++) {
          positions[i * 3]     = (Math.random() - 0.5) * 80;
          positions[i * 3 + 1] = (Math.random() - 0.5) * 50;
          positions[i * 3 + 2] = (Math.random() - 0.5) * 30;
          velocities.push({
            x: (Math.random() - 0.5) * 0.02,
            y: (Math.random() - 0.5) * 0.02,
            z: (Math.random() - 0.5) * 0.01
          });
        }

        var nodeGeo = new THREE.BufferGeometry();
        nodeGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        var nodeMat = new THREE.PointsMaterial({ color: 0x00d4ff, size: 0.4, transparent: true, opacity: 0.8 });
        var nodes = new THREE.Points(nodeGeo, nodeMat);
        scene.add(nodes);

        var lineMat = new THREE.LineBasicMaterial({ color: 0x00d4ff, transparent: true, opacity: 0.08 });
        var lineObj = null;

        function buildLines() {
          if (lineObj) scene.remove(lineObj);
          var lp = [];
          var threshold = 18;
          for (var a = 0; a < nodeCount; a++) {
            for (var b = a + 1; b < nodeCount; b++) {
              var dx = positions[a*3]   - positions[b*3];
              var dy = positions[a*3+1] - positions[b*3+1];
              var dz = positions[a*3+2] - positions[b*3+2];
              if (Math.sqrt(dx*dx + dy*dy + dz*dz) < threshold) {
                lp.push(positions[a*3], positions[a*3+1], positions[a*3+2]);
                lp.push(positions[b*3], positions[b*3+1], positions[b*3+2]);
              }
            }
          }
          var lg = new THREE.BufferGeometry();
          lg.setAttribute('position', new THREE.BufferAttribute(new Float32Array(lp), 3));
          lineObj = new THREE.LineSegments(lg, lineMat);
          scene.add(lineObj);
        }
        buildLines();

        var t1 = new THREE.Mesh(
          new THREE.TorusGeometry(6, 0.15, 16, 100),
          new THREE.MeshBasicMaterial({ color: 0x00d4ff, transparent: true, opacity: 0.15 })
        );
        scene.add(t1);

        var t2 = new THREE.Mesh(
          new THREE.TorusGeometry(4, 0.08, 16, 100),
          new THREE.MeshBasicMaterial({ color: 0xff6b35, transparent: true, opacity: 0.12 })
        );
        t2.rotation.x = Math.PI / 2;
        scene.add(t2);

        var mx = 0, my = 0;
        document.addEventListener('mousemove', function(e) {
          mx = (e.clientX / window.innerWidth  - 0.5) * 0.3;
          my = -(e.clientY / window.innerHeight - 0.5) * 0.3;
        });

        window.addEventListener('resize', function() {
          camera.aspect = window.innerWidth / window.innerHeight;
          camera.updateProjectionMatrix();
          renderer.setSize(window.innerWidth, window.innerHeight);
        });

        var frame = 0;
        function animate() {
          requestAnimationFrame(animate);
          frame++;
          for (var k = 0; k < nodeCount; k++) {
            positions[k*3]   += velocities[k].x;
            positions[k*3+1] += velocities[k].y;
            positions[k*3+2] += velocities[k].z;
            if (Math.abs(positions[k*3])   > 40) velocities[k].x *= -1;
            if (Math.abs(positions[k*3+1]) > 25) velocities[k].y *= -1;
            if (Math.abs(positions[k*3+2]) > 15) velocities[k].z *= -1;
          }
          nodeGeo.attributes.position.needsUpdate = true;
          if (frame % 3 === 0) buildLines();
          t1.rotation.x += 0.003; t1.rotation.y += 0.005;
          t2.rotation.y += 0.004; t2.rotation.z += 0.003;
          camera.position.x += (mx * 5 - camera.position.x) * 0.05;
          camera.position.y += (my * 3 - camera.position.y) * 0.05;
          camera.lookAt(0, 0, 0);
          renderer.render(scene, camera);
        }
        animate();
      }
    })();
  </script>
</body>
</html>
